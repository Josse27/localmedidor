<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Busca Instalação/Medidor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh; /* ocupa toda a altura da tela */
      display: flex;
      justify-content: center; /* centraliza horizontalmente */
      align-items: center;     /* centraliza verticalmente */
      background-color: #f9f9f9;
    }
    .container {
      text-align: center;
    }
    input {
      padding: 5px;
      margin-right: 10px;
    }
    button {
      padding: 5px 10px;
    }
    #resultado {
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Buscar Instalação ou Medidor</h2>
    <input type="text" id="busca" placeholder="Digite instalação ou medidor">
    <button onclick="buscar()">Buscar</button>
    <div id="resultado"></div>
  </div>

  <script>
    function buscar() {
      const valor = document.getElementById("busca").value;
      document.getElementById("resultado").innerText = "Você buscou por: " + valor;
    }
  </script>
</body>
</html>


  <script>
    // Aqui você coloca os dados da planilha
    const dados = [
    
      const termo = document.getElementById("busca").value.trim();
      const item = dados.find(d => d.instalacao === termo || d.medidor === termo);

      if (item) {
        document.getElementById("resultado").innerHTML = `
          <strong>Instalacao:</strong> ${item.instalacao}<br>
          <strong>Medidor:</strong> ${item.medidor}<br>
          <strong>Latitude:</strong> ${item.latitude}<br>
          <strong>Longitude:</strong> ${item.longitude}<br>
          <a href="https://www.google.com/maps?q=${item.latitude},${item.longitude}" target="_blank">
            Ver no Google Maps
          </a>
        `;
      } else {
        document.getElementById("resultado").innerHTML = "❌ Não encontrado.";
      }
    }
  </script>
</body>

</html>
