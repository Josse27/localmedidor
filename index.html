<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Medidor</title>
<style>body{font-family:Arial;background:#f0f2f5;margin:0;padding:15px;display:flex;justify-content:center}.box{background:#fff;padding:20px;border-radius:12px;width:100%;max-width:430px;text-align:center} input{width:100%;padding:14px;border:2px solid #ddd;border-radius:8px;box-sizing:border-box} a.b,button.b{width:100%;padding:14px;margin-top:10px;border:none;border-radius:8px;font-weight:bold;font-size:16px;display:block;text-decoration:none;box-sizing:border-box}.buscar{background:#003366;color:#fff}</style>
</head>
<body>
<div class="box">
<h2 style="color:#003366">Buscar Medidor</h2>
<small id="st" style="color:red">Carregando dados.json...</small><br>
<input id="busca" placeholder="Ex: 111524">
<button class="b buscar" onclick="buscar()">BUSCAR</button>
<div id="r" style="display:none;margin-top:15px;background:#e8f0fe;padding:15px;border-radius:8px;text-align:left"></div>
</div>
<script>
let D=[];
fetch('./dados.json?v='+Date.now()).then(r=>{
  if(!r.ok) throw new Error('dados.json não encontrado - status '+r.status);
  return r.json();
}).then(j=>{
  D=j;
  document.getElementById('st').innerText=j.length.toLocaleString('pt-BR')+' registros carregados';
  document.getElementById('st').style.color='green';
}).catch(e=>{
  document.getElementById('st').innerText='ERRO: '+e.message;
  document.getElementById('st').innerHTML+='<br>Verifique em github.com/josse27/localmedidor se o arquivo se chama exatamente dados.json';
});
function buscar(){
  let q=document.getElementById('busca').value.trim().toLowerCase();
  let div=document.getElementById('r');
  div.style.display='block';
  if(!D.length){div.innerHTML='Aguarde carregar dados...';return;}
  if(!q){div.innerHTML='Digite instalação';return;}
  let a=D.find(it=>String(it.instalacao||it.Instalacao||'').toLowerCase().includes(q) || String(it.medidor||'').toLowerCase().includes(q));
  if(!a){div.innerHTML='❌ Não encontrado: '+q;return;}
  let lat=String(a.latitude||'').replace(',','.'); let lon=String(a.longitude||'').replace(',','.');
  // corrige -6.383.333
  if((lat.match(/\./g)||[]).length>1){let p=lat.split('.');lat=p[0]+'.'+p.slice(1).join('');}
  if((lon.match(/\./g)||[]).length>1){let p=lon.split('.');lon=p[0]+'.'+p.slice(1).join('');}
  let inst=a.instalacao||a.Instalacao;
  let med=a.medidor;
  div.innerHTML=`<b>Inst:</b> ${inst}<br><b>Med:</b> ${med}<br><b>Lat:</b> ${lat}<br><b>Lon:</b> ${lon}<br><br>
  <a class="b" style="background:#25D366;color:#fff" href="https://www.google.com/maps/search/?api=1&query=${lat},${lon}" target="_blank">📍 ABRIR NO MAPS</a>
  <a class="b" style="background:#33CCFF" href="https://waze.com/ul?ll=${lat},${lon}&navigate=yes" target="_blank">🔵 WAZE</a>
  <button class="b" style="background:#eee" onclick="navigator.clipboard.writeText('${lat},${lon}');alert('Copiado')">📋 COPIAR</button>`;
}
</script>
</body>
</html>
